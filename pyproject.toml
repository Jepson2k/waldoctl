[build-system]
requires = ["setuptools>=61", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "waldoctl"
dynamic = ["version"]
description = "Shared interface definitions for robot arm control"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "numpy>=1.24,<2.5",  # numba (via parol6) requires numpy<2.5
    # NiceGUI is a runtime dep so the public state classes can use
    # @binding.bindable_dataclass for synchronous attribute propagation.
    # Pinned to the same Jepson2k/nicegui fork SHA that Waldo-Commander uses so
    # both resolve to the identical binding build — keep in sync with WC's pin
    # (bumped together via /nicegui-combo-bump).
    "nicegui @ git+https://github.com/Jepson2k/nicegui.git@4f3e88841666a98f289f00c7581f319576a636c0",
]

[project.optional-dependencies]
dev = ["ruff", "ty", "pytest", "pre-commit"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["waldoctl*"]

[tool.setuptools_scm]
# Version comes from the latest git tag reachable from HEAD.

[tool.ty]
