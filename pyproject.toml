[build-system]
requires = ["setuptools>=61", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "waldoctl"
dynamic = ["version"]
description = "Shared interface definitions for robot arm control"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["ruff", "ty", "pytest", "pre-commit"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["waldoctl*"]

[tool.setuptools_scm]
# Version comes from the latest git tag reachable from HEAD.

[tool.ty]
