[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "waldoctl"
version = "0.2.0"
description = "Shared interface definitions for robot arm control"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["ruff", "ty", "pytest", "pre-commit"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["waldoctl*"]

[tool.ty]

# Release tooling: `tbump <new_version>` edits pyproject.toml, commits, tags
# and pushes (main + tag) in one shot. Install with `pip install tbump`.
[tool.tbump]
github_url = "https://github.com/Jepson2k/waldoctl"

[tool.tbump.version]
current = "0.2.0"
regex = '''(?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)'''

[tool.tbump.git]
message_template = "bump version to {new_version}"
tag_template = "v{new_version}"

[[tool.tbump.file]]
src = "pyproject.toml"
search = 'version = "{current_version}"'
